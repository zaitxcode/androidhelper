# JitPack build configuration.
#
# The JitPack default image intermittently fails with:
#   "An unexpected error occurred while trying to open file
#    .../gradle/wrapper/gradle-wrapper.jar"
# before Gradle even starts. It is non-deterministic (identical commits
# sometimes pass and sometimes fail) and is tracked upstream as
# jitpack/jitpack.io#8096 and #8097.
#
# To make the build independent of the wrapper jar, Gradle is installed and
# activated through SDKMAN and invoked directly. The version matches the one
# pinned in gradle/wrapper/gradle-wrapper.properties, so the build is identical
# to a normal ./gradlew run.

before_install:
  - sdk install java 21.0.2-open || true
  - sdk install gradle 9.6.0 || true

install:
  - . "${SDKMAN_DIR:-$HOME/.sdkman}/bin/sdkman-init.sh" && sdk use java 21.0.2-open && sdk use gradle 9.6.0 && gradle -Pgroup=com.github.zaitxcode -Pversion=${VERSION:-1.0.0-beta07} --no-daemon -xlint -xlintVitalRelease -xlintVitalAnalyzeRelease :library:publishReleasePublicationToMavenLocal

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.parallel=true -Dkotlin.daemon.jvmargs=-Xmx1g"

artifacts:
  - path: library/build/outputs/aar/library-release.aar
    type: aar
