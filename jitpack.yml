jdk:
  - openjdk21

install:
  # Build only the library and publish to local maven (JitPack will pick it up).
  - ./gradlew -Pgroup=com.github.zaitxcode -Pversion=${VERSION:-1.0.0-alpha03} --no-daemon -xlint -xlintVitalRelease -xlintVitalAnalyzeRelease :library:publishReleasePublicationToMavenLocal

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.parallel=true -Dkotlin.daemon.jvmargs=-Xmx1g"

artifacts:
  - path: library/build/outputs/aar/library-release.aar
    type: aar
